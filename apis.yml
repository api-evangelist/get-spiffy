aid: get-spiffy
name: Spiffy
description: 'Get Spiffy, Inc. (Spiffy) is a B2B SaaS and operations company that sells
  a mobile service operating system to franchise car dealerships. Its core product,
  Mobile 360, is an enterprise platform covering scheduling, dispatch, route optimization,
  technician management, digital vehicle inspections, DMS integration and customer
  communication, sold as a turnkey program alongside van upfits, connected devices
  (Easy Tread, Easy Flow, Smart Tumbler) and technician training. Spiffy also runs
  fleet and Amazon DSP service programs, and operates a customer booking portal and a
  fleet portal. Founded in 2014 and headquartered in Apex, North Carolina, the company
  has raised more than $90M and reports over 4 million completed services, with OEM
  work including a Hyundai Motor America pilot. Spiffy publishes no public developer
  program, API reference or machine-readable specification; its Fleet portal API is an
  internal, credentialed surface with no published contract.'
